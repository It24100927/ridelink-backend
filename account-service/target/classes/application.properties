server.port=${SERVER_PORT:8001}
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017}
spring.data.mongodb.database=ridelink_accounts
spring.data.mongodb.auto-index-creation=true
springdoc.swagger-ui.path=/swagger-ui.html
spring.application.name=account-service
security.jwt.secret=${RIDE_LINK_JWT_SECRET:development-secret-change-before-use}
security.admin.email=${ADMIN_EMAIL:}
security.admin.password=${ADMIN_PASSWORD:}
