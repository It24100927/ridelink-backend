spring.profiles.active=local
spring.config.import=optional:file:.env[.properties],optional:classpath:application-local.properties
spring.application.name=driver-vehicle-service
server.port=${DRIVER_SERVICE_PORT:8082}

spring.mongodb.uri=${DRIVER_MONGODB_URI:mongodb://localhost:27017/driver_db}
spring.mongodb.database=${DRIVER_DB_NAME:driver_db}
spring.data.mongodb.uri=${DRIVER_MONGODB_URI:mongodb://localhost:27017/driver_db}
spring.data.mongodb.database=${DRIVER_DB_NAME:driver_db}

jwt.secret=${JWT_SECRET:dummy-default-secret-key-replace-this}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
