spring.application.name=fare-payment-service
server.port=8084
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/ridelink_fare_payment_db}
# One final fare per ride is enforced by a unique index on rideId
spring.data.mongodb.auto-index-creation=true
security.jwt.secret=${JWT_SECRET}
security.jwt.roles-claim=roles
fare.base-fare=150.00
fare.rate-per-km=80.00
fare.minimum-fare=250.00
fare.currency=LKR
