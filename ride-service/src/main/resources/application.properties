spring.application.name=ride-management-service
server.port=${RIDE_SERVICE_PORT:8088}

# Load local secrets (gitignored) via Spring Profile
spring.profiles.active=local

# MongoDB - Atlas URI
# MongoDB - Atlas URI
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI}
spring.data.mongodb.database=${SPRING_DATA_MONGODB_DATABASE:ride_db}

# Use the same signing key as account-service. Set JWT_SECRET before startup.
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# Inter-Service URLs
account.service.url=${ACCOUNT_SERVICE_URL:http://localhost:8081}
driver.service.url=${DRIVER_SERVICE_URL:http://localhost:8082}
fare.service.url=${FARE_PAYMENT_SERVICE_URL:http://localhost:8084}

# Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.operationsSorter=method
# Disable Spring Security basic-auth popup
spring.security.user.name=disabled
spring.security.user.password=disabled


