server:
  port: 8082 

spring:
  spring:
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  application:
    name: driver-vehicle-service
  data:
    mongodb:
      uri: mongodb://localhost:27017/driverdb
      auto-index-creation: true

  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

# JWT Configuration (CRITICAL: This must be at the root level, not indented under spring)
jwt:
  secret: ${JWT_SECRET:ridelink-super-secret-key-for-jwt-token-signing-must-be-at-least-256-bits}

# OpenAPI / Swagger
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

# Actuator (Health checks)
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# Logging
logging:
  level:
    com.ridelink.driver: DEBUG
    org.springframework.security: INFO